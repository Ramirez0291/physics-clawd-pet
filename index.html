<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawd</title>
    <style>
      /* 日文系统里汉字要用日文字形（直、骨、令……），所以字体栈按 <html lang> 切换 */
      :root {
        --ui-font: system-ui, 'Microsoft YaHei UI', sans-serif;
      }
      :root:lang(ja) {
        --ui-font: system-ui, 'Yu Gothic UI', 'Meiryo UI', sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      /* 小助手的提醒气泡：位置由 companion.ts 每帧用 transform 摆 */
      .bubble {
        --accent: #d77757;
        --tail: 50%;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        min-width: 150px;
        max-width: 260px;
        box-sizing: border-box;
        padding: 9px 28px 10px 12px;
        background: #faf9f5;
        color: #141413;
        border: 2px solid #141413;
        border-radius: 6px;
        box-shadow: 3px 3px 0 rgba(20, 20, 19, 0.3);
        font: 13px/1.45 var(--ui-font);
        white-space: pre-line;
        overflow-wrap: anywhere;
        cursor: default;
        opacity: 0;
        scale: 0.85;
        transform-origin: var(--tail) 100%;
        transition:
          opacity 0.18s,
          scale 0.22s cubic-bezier(0.3, 1.6, 0.6, 1);
      }
      .bubble.in {
        opacity: 1;
        scale: 1;
      }
      .bubble.below {
        transform-origin: var(--tail) 0;
      }
      .bubble::after {
        content: '';
        position: absolute;
        left: calc(var(--tail) - 7px);
        bottom: -8px;
        width: 10px;
        height: 10px;
        background: #faf9f5;
        border-right: 2px solid #141413;
        border-bottom: 2px solid #141413;
        transform: rotate(45deg);
      }
      .bubble.below::after {
        bottom: auto;
        top: -8px;
        transform: rotate(225deg);
      }
      .bubble.kind-chime {
        --accent: #e0a91b;
      }
      .bubble.kind-rest {
        --accent: #1f9d5b;
      }
      .bubble.kind-event {
        --accent: #d6453d;
      }
      .bubble.kind-todo {
        --accent: #2f7ad1;
      }
      .bubble.kind-claude {
        --accent: #c96442;
        max-width: 320px;
      }
      .bubble-code {
        margin: 6px 0 0;
        padding: 5px 7px;
        max-height: 7.5em;
        overflow: hidden;
        border-radius: 4px;
        background: #141413;
        color: #f4f1ea;
        font: 12px/1.4 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .bubble-title {
        font-weight: 600;
      }
      .bubble-title::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        vertical-align: 1px;
        background: var(--accent);
      }
      .bubble-body {
        margin-top: 2px;
        color: #3d3d3a;
      }
      .bubble-x {
        position: absolute;
        top: 3px;
        right: 5px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: none;
        color: #6b6f7d;
        font: 16px/20px system-ui, sans-serif;
        cursor: pointer;
      }
      .bubble-x:hover {
        color: #141413;
      }
      .bubble-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .bubble-actions button {
        padding: 2px 10px;
        border: 2px solid #141413;
        border-radius: 4px;
        background: #fff;
        color: #141413;
        font: 12px/1.5 var(--ui-font);
        cursor: pointer;
      }
      .bubble-actions button:hover {
        background: #f0eee6;
      }
      .bubble-actions button.primary {
        background: var(--accent);
        color: #fff;
      }
      .bubble-actions button.primary:hover {
        filter: brightness(1.08);
      }
      /* 以下只在浏览器预览时生效 */
      body.browser {
        background:
          radial-gradient(circle at 20% 15%, #5b7fa6 0, transparent 45%),
          radial-gradient(circle at 85% 80%, #f0d9c4 0, transparent 40%),
          linear-gradient(135deg, #2d3e55, #6b7f99 55%, #d8c7b5);
      }
      .preview-bar {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(20, 20, 19, 0.75);
        color: #f4f1ea;
        font: 13px/1.4 system-ui, sans-serif;
        z-index: 1;
        pointer-events: auto;
      }
      .preview-bar button {
        font: inherit;
        border: 0;
        border-radius: 6px;
        padding: 2px 8px;
        background: #d77757;
        color: #fff;
        cursor: pointer;
      }
      .preview-input {
        position: fixed;
        left: 24px;
        bottom: 12px;
        width: min(360px, 45vw);
        height: 44px;
        padding: 8px 12px;
        box-sizing: border-box;
        border: 1px solid #d77757;
        border-radius: 10px;
        background: rgba(250, 249, 245, 0.92);
        color: #141413;
        font: 14px/1.4 system-ui, sans-serif;
        resize: none;
        z-index: 1;
        user-select: text;
      }
      body:not(.browser) .preview-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
