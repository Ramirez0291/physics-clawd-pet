[package]
name = "clawd-pet"
version = "0.1.0"
description = "A desktop pet with exaggerated cartoon physics"
edition = "2021"
license = "MIT"

[lib]
name = "clawd_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
